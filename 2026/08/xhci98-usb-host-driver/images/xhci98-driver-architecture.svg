<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 860" width="660" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Internal architecture of xhci98.sys</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <rect width="660" height="860" fill="#ffffff"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Inside xhci98.sys</text>

  <!-- Layer labels -->
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="14" y="78">HOST</text>
    <text x="14" y="164">CALLBACK</text>
    <text x="14" y="177">SURFACE</text>
    <text x="14" y="310">ENGINES</text>
    <text x="14" y="464">PURE CORE</text>
    <text x="14" y="580">BUS ACCESS</text>
    <text x="14" y="690">HARDWARE</text>
  </g>
  <g stroke="#e6e6e6" stroke-dasharray="4 4">
    <line x1="10" y1="110" x2="650" y2="110"/>
    <line x1="10" y1="250" x2="650" y2="250"/>
    <line x1="10" y1="400" x2="650" y2="400"/>
    <line x1="10" y1="540" x2="650" y2="540"/>
    <line x1="10" y1="630" x2="650" y2="630"/>
    <line x1="10" y1="782" x2="650" y2="782"/>
  </g>

  <!-- HOST -->
  <rect x="100" y="50" width="532" height="50" rx="6" fill="#e3f1e4" stroke="#4f8a57" stroke-width="1.5"/>
  <text x="366" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4a22">usbport.sys</text>
  <text x="366" y="88" text-anchor="middle" font-size="11" fill="#333">calls the miniport only through the 316-byte registration packet filled in at DriverEntry</text>

  <!-- Big driver outline -->
  <rect x="100" y="120" width="532" height="500" rx="10" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <text x="108" y="137" font-size="12" font-weight="bold" fill="#b33a00">xhci98.sys</text>

  <!-- CALLBACK SURFACE -->
  <g font-size="10.5">
    <rect x="110" y="146" width="122" height="92" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="171" y="163" text-anchor="middle" font-weight="bold" fill="#222">xhci_dispatch.c</text>
    <text x="171" y="179" text-anchor="middle" fill="#444">DriverEntry, registration</text>
    <text x="171" y="193" text-anchor="middle" fill="#444">packet, Start / Stop /</text>
    <text x="171" y="207" text-anchor="middle" fill="#444">Suspend / Resume,</text>
    <text x="171" y="221" text-anchor="middle" fill="#444">PassThru for XHCISNAP</text>

    <rect x="240" y="146" width="122" height="92" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="301" y="163" text-anchor="middle" font-weight="bold" fill="#222">xhci_rh.c</text>
    <text x="301" y="179" text-anchor="middle" fill="#444">root-hub callbacks:</text>
    <text x="301" y="193" text-anchor="middle" fill="#444">port count, status,</text>
    <text x="301" y="207" text-anchor="middle" fill="#444">reset, power, change</text>
    <text x="301" y="221" text-anchor="middle" fill="#444">clears, health poll</text>

    <rect x="370" y="146" width="122" height="92" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="431" y="163" text-anchor="middle" font-weight="bold" fill="#222">xhci_slot.c</text>
    <text x="431" y="179" text-anchor="middle" fill="#444">devices and endpoints:</text>
    <text x="431" y="193" text-anchor="middle" fill="#444">Enable Slot, Address</text>
    <text x="431" y="207" text-anchor="middle" fill="#444">Device, Configure EP,</text>
    <text x="431" y="221" text-anchor="middle" fill="#444">SET_ADDRESS intercept</text>

    <rect x="500" y="146" width="122" height="92" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="561" y="163" text-anchor="middle" font-weight="bold" fill="#222">xhci_xfer.c</text>
    <text x="561" y="179" text-anchor="middle" fill="#444">transfer engine:</text>
    <text x="561" y="193" text-anchor="middle" fill="#444">URB pieces to TDs,</text>
    <text x="561" y="207" text-anchor="middle" fill="#444">pending queue, control /</text>
    <text x="561" y="221" text-anchor="middle" fill="#444">bulk / interrupt / iso</text>
  </g>

  <!-- ENGINES -->
  <g font-size="10.5">
    <rect x="110" y="262" width="122" height="122" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="171" y="279" text-anchor="middle" font-weight="bold" fill="#222">xhci_init.c</text>
    <text x="171" y="295" text-anchor="middle" fill="#444">BIOS handoff, reset,</text>
    <text x="171" y="309" text-anchor="middle" fill="#444">DCBAA, scratchpad,</text>
    <text x="171" y="323" text-anchor="middle" fill="#444">rings, RUN, port power,</text>
    <text x="171" y="337" text-anchor="middle" fill="#444">suspend / resume,</text>
    <text x="171" y="351" text-anchor="middle" fill="#444">in-place recovery from</text>
    <text x="171" y="365" text-anchor="middle" fill="#444">a hardware reset</text>

    <rect x="240" y="262" width="122" height="122" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="301" y="279" text-anchor="middle" font-weight="bold" fill="#222">xhci_cmd.c</text>
    <text x="301" y="295" text-anchor="middle" fill="#444">command engine:</text>
    <text x="301" y="309" text-anchor="middle" fill="#444">one command in flight,</text>
    <text x="301" y="323" text-anchor="middle" fill="#444">millisecond watchdog,</text>
    <text x="301" y="337" text-anchor="middle" fill="#444">abort ladder, No Op</text>
    <text x="301" y="351" text-anchor="middle" fill="#444">self-test at every start</text>

    <rect x="370" y="262" width="122" height="122" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="431" y="279" text-anchor="middle" font-weight="bold" fill="#222">xhci_evt.c</text>
    <text x="431" y="295" text-anchor="middle" fill="#444">interrupt path:</text>
    <text x="431" y="309" text-anchor="middle" fill="#444">ISR claims the line,</text>
    <text x="431" y="323" text-anchor="middle" fill="#444">DPC drains the event</text>
    <text x="431" y="337" text-anchor="middle" fill="#444">ring and completes</text>
    <text x="431" y="351" text-anchor="middle" fill="#444">transfers, port changes</text>
    <text x="431" y="365" text-anchor="middle" fill="#444">and commands</text>

    <rect x="500" y="262" width="122" height="122" rx="6" fill="#fff1e6" stroke="#d9480f"/>
    <text x="561" y="279" text-anchor="middle" font-weight="bold" fill="#222">xhci_topo.c</text>
    <text x="561" y="293" text-anchor="middle" font-weight="bold" fill="#222">xhci_desc.c</text>
    <text x="561" y="309" text-anchor="middle" fill="#444">snoop hub and config</text>
    <text x="561" y="323" text-anchor="middle" fill="#444">descriptors on EP0 to</text>
    <text x="561" y="337" text-anchor="middle" fill="#444">rebuild the hub tree,</text>
    <text x="561" y="351" text-anchor="middle" fill="#444">TT hubs and iso</text>
    <text x="561" y="365" text-anchor="middle" fill="#444">intervals usbport hides</text>
  </g>

  <!-- PURE CORE -->
  <rect x="110" y="412" width="512" height="118" rx="6" fill="#eef4ff" stroke="#7a9cc6" stroke-width="1.5"/>
  <text x="366" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f3c66">Pure core: no MMIO, no DDK calls, no IRQL. Built and unit-tested on the Windows 11 host.</text>
  <g font-size="10.5">
    <rect x="120" y="440" width="94" height="80" rx="5" fill="#ffffff" stroke="#7a9cc6"/>
    <text x="167" y="457" text-anchor="middle" font-weight="bold" fill="#222">xhci_ring.c</text>
    <text x="167" y="473" text-anchor="middle" fill="#444">TRB encoding,</text>
    <text x="167" y="487" text-anchor="middle" fill="#444">command / event /</text>
    <text x="167" y="501" text-anchor="middle" fill="#444">transfer ring</text>
    <text x="167" y="515" text-anchor="middle" fill="#444">state machines</text>

    <rect x="222" y="440" width="94" height="80" rx="5" fill="#ffffff" stroke="#7a9cc6"/>
    <text x="269" y="457" text-anchor="middle" font-weight="bold" fill="#222">xhci_ctx.c</text>
    <text x="269" y="473" text-anchor="middle" fill="#444">Slot, Endpoint</text>
    <text x="269" y="487" text-anchor="middle" fill="#444">and Input Control</text>
    <text x="269" y="501" text-anchor="middle" fill="#444">Context</text>
    <text x="269" y="515" text-anchor="middle" fill="#444">encoding</text>

    <rect x="324" y="440" width="94" height="80" rx="5" fill="#ffffff" stroke="#7a9cc6"/>
    <text x="371" y="457" text-anchor="middle" font-weight="bold" fill="#222">xhci_caps.c</text>
    <text x="371" y="473" text-anchor="middle" fill="#444">extended</text>
    <text x="371" y="487" text-anchor="middle" fill="#444">capability walk,</text>
    <text x="371" y="501" text-anchor="middle" fill="#444">USB2 / USB3 port</text>
    <text x="371" y="515" text-anchor="middle" fill="#444">classification</text>

    <rect x="426" y="440" width="94" height="80" rx="5" fill="#ffffff" stroke="#7a9cc6"/>
    <text x="473" y="457" text-anchor="middle" font-weight="bold" fill="#222">xhci_port.c</text>
    <text x="473" y="473" text-anchor="middle" fill="#444">PORTSC writes</text>
    <text x="473" y="487" text-anchor="middle" fill="#444">that touch only</text>
    <text x="473" y="501" text-anchor="middle" fill="#444">the intended bit,</text>
    <text x="473" y="515" text-anchor="middle" fill="#444">port state to hub</text>

    <rect x="528" y="440" width="84" height="80" rx="5" fill="#ffffff" stroke="#7a9cc6"/>
    <text x="570" y="457" text-anchor="middle" font-weight="bold" fill="#222">xhci_mem.c</text>
    <text x="570" y="473" text-anchor="middle" fill="#444">common-buffer</text>
    <text x="570" y="487" text-anchor="middle" fill="#444">carve, alignment</text>
    <text x="570" y="501" text-anchor="middle" fill="#444">and boundary</text>
    <text x="570" y="515" text-anchor="middle" fill="#444">checks</text>
  </g>

  <!-- BUS ACCESS -->
  <rect x="110" y="552" width="512" height="58" rx="6" fill="#fff1e6" stroke="#d9480f" stroke-width="2"/>
  <text x="366" y="572" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">xhci_pci.c</text>
  <text x="366" y="589" text-anchor="middle" font-size="10.5" fill="#444">the only file that reads or writes BAR0 registers, doorbells or PCI config space</text>
  <text x="366" y="603" text-anchor="middle" font-size="10.5" fill="#8a3b00" font-style="italic">everything above decides what to write; this is where it becomes a bus cycle</text>

  <!-- HARDWARE -->
  <g font-size="10.5">
    <rect x="100" y="642" width="250" height="130" rx="6" fill="#f3f4f6" stroke="#9aa0a6"/>
    <text x="225" y="661" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">xHCI controller registers</text>
    <text x="225" y="680" text-anchor="middle" fill="#444">Capability and Operational registers</text>
    <text x="225" y="695" text-anchor="middle" fill="#444">USBCMD, USBSTS, CRCR, DCBAAP</text>
    <text x="225" y="710" text-anchor="middle" fill="#444">PORTSC x 18  (12 USB 2.0 managed)</text>
    <text x="225" y="725" text-anchor="middle" fill="#444">Interrupter 0: IMAN, ERSTBA, ERDP</text>
    <text x="225" y="740" text-anchor="middle" fill="#444">Doorbell array</text>
    <text x="225" y="758" text-anchor="middle" fill="#666" font-style="italic">legacy INTx through the 8259 PIC</text>

    <rect x="382" y="642" width="250" height="130" rx="6" fill="#f3f4f6" stroke="#9aa0a6"/>
    <text x="507" y="661" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Common buffer (DMA)</text>
    <text x="507" y="680" text-anchor="middle" fill="#444">one fixed block usbport hands over</text>
    <text x="507" y="695" text-anchor="middle" fill="#444">at StartController, carved into:</text>
    <text x="507" y="712" text-anchor="middle" fill="#444">DCBAA, scratchpad pages, command ring,</text>
    <text x="507" y="727" text-anchor="middle" fill="#444">event ring + ERST, device and input</text>
    <text x="507" y="742" text-anchor="middle" fill="#444">contexts, per-endpoint transfer rings</text>
    <text x="507" y="758" text-anchor="middle" fill="#666" font-style="italic">read by the controller, written by the driver</text>
  </g>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="171" y1="102" x2="171" y2="144"/>
    <line x1="301" y1="102" x2="301" y2="144"/>
    <line x1="431" y1="102" x2="431" y2="144"/>
    <line x1="561" y1="102" x2="561" y2="144"/>
  </g>
  <text x="496" y="114" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic">callbacks down,</text><text x="496" y="135" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic">completions up</text>

  <g stroke="#555" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="171" y1="240" x2="171" y2="260"/>
    <line x1="301" y1="240" x2="301" y2="260"/>
    <line x1="431" y1="240" x2="431" y2="260"/>
    <line x1="561" y1="240" x2="561" y2="260"/>
    <line x1="171" y1="386" x2="171" y2="410"/>
    <line x1="301" y1="386" x2="301" y2="410"/>
    <line x1="431" y1="386" x2="431" y2="410"/>
    <line x1="561" y1="386" x2="561" y2="410"/>
  </g>
  <line x1="366" y1="532" x2="366" y2="550" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="545" font-size="9.5" fill="#555" font-style="italic">values in, values out</text>

  <g stroke="#d9480f" stroke-width="2.5" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)">
    <line x1="225" y1="612" x2="225" y2="640"/>
    <line x1="507" y1="612" x2="507" y2="640"/>
  </g>
  <text x="238" y="630" font-size="9.5" fill="#d9480f" font-weight="bold">MMIO + IRQ</text>
  <text x="520" y="630" font-size="9.5" fill="#d9480f" font-weight="bold">DMA</text>

  <!-- Legend -->
  <g font-size="10.5">
    <rect x="100" y="796" width="14" height="14" fill="#fff1e6" stroke="#d9480f" stroke-width="2"/>
    <text x="120" y="807" fill="#333">driver code that touches usbport, the DDK or hardware</text>
    <rect x="100" y="816" width="14" height="14" fill="#eef4ff" stroke="#7a9cc6"/>
    <text x="120" y="827" fill="#333">pure computation, unit-tested on the build host without Windows 98</text>
    <rect x="100" y="836" width="14" height="14" fill="#e3f1e4" stroke="#4f8a57"/>
    <text x="120" y="847" fill="#333">Microsoft / NUSB code</text>
    <rect x="400" y="836" width="14" height="14" fill="#f3f4f6" stroke="#9aa0a6"/>
    <text x="420" y="847" fill="#333">hardware and DMA memory</text>
  </g>
</svg>
