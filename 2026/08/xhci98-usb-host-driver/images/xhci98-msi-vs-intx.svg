<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Why xhci98.sys uses the INTx# pin instead of MSI/MSI-X</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
  </defs>

  <rect width="800" height="580" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Why xhci98.sys relies on INTx# and never touches MSI / MSI-X</text>

  <!-- Shared source: xHCI controller + event ring -->
  <rect x="250" y="52" width="300" height="70" rx="6" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="400" y="76" text-anchor="middle" font-weight="bold" fill="#222">xHCI controller</text>
  <text x="400" y="94" text-anchor="middle" fill="#444">appends to the Event Ring:</text>
  <text x="400" y="110" text-anchor="middle" fill="#444" font-size="12">completed transfers · port changes · finished commands</text>


  <!-- Split arrows -->
  <path d="M330,122 L330,152 L200,152 L200,176" fill="none" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arrowRed)" stroke-dasharray="5 4"/>
  <path d="M470,122 L470,152 L600,152 L600,176" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="252" y="124" width="296" height="17" fill="#ffffff"/>
  <text x="400" y="136" text-anchor="middle" fill="#666" font-size="12" font-style="italic">"something is in the ring" must reach software somehow</text>

  <!-- ================= LEFT PANEL: MSI ================= -->
  <rect x="40" y="178" width="320" height="340" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#c92a2a">MSI / MSI-X (not usable)</text>

  <rect x="70" y="216" width="260" height="46" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="200" y="235" text-anchor="middle" fill="#222">Device performs a memory write</text>
  <text x="200" y="252" text-anchor="middle" fill="#555" font-size="12">to an address + vector programmed by the OS</text>

  <line x1="200" y1="262" x2="200" y2="284" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="286" width="260" height="46" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="200" y="305" text-anchor="middle" fill="#222">CPU Local APIC</text>
  <text x="200" y="322" text-anchor="middle" fill="#555" font-size="12">receives the write, raises the vector</text>

  <line x1="200" y1="332" x2="200" y2="354" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arrowRed)" stroke-dasharray="4 3"/>

  <!-- Missing block -->
  <rect x="70" y="356" width="260" height="66" rx="5" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="200" y="378" text-anchor="middle" font-weight="bold" fill="#c92a2a">OS APIC interrupt subsystem</text>
  <text x="200" y="396" text-anchor="middle" fill="#555" font-size="12">allocates address/vector, programs device,</text>
  <text x="200" y="411" text-anchor="middle" fill="#555" font-size="12">dispatches the vector to the driver</text>
  <!-- big X -->
  <g stroke="#c92a2a" stroke-width="5" stroke-linecap="round" opacity="0.28">
    <line x1="78" y1="362" x2="322" y2="416"/>
    <line x1="322" y1="362" x2="78" y2="416"/>
  </g>

  <g font-size="12" fill="#444">
    <text x="70" y="448"><tspan font-weight="bold" fill="#c92a2a">Win98:</tspan> no APIC subsystem at all, only</text>
    <text x="70" y="464">the 8259 PIC handled by the VMM.</text>
    <text x="70" y="484"><tspan font-weight="bold" fill="#c92a2a">Win2000:</tspan> NT kernel only gained MSI in Vista.</text>
    <text x="70" y="506" font-style="italic" fill="#666">A driver cannot bolt its own APIC handling on</text>
  </g>

  <!-- ================= RIGHT PANEL: INTx ================= -->
  <rect x="440" y="178" width="320" height="340" rx="8" fill="#f4faf4" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="600" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b8a3e">Legacy INTx# (what xhci98 uses)</text>

  <rect x="470" y="216" width="260" height="46" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="600" y="235" text-anchor="middle" fill="#222">Controller asserts its INTx# pin</text>
  <text x="600" y="252" text-anchor="middle" fill="#555" font-size="12">shared, level-triggered IRQ line</text>

  <line x1="600" y1="262" x2="600" y2="284" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="286" width="260" height="46" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="600" y="305" text-anchor="middle" fill="#222">8259 PIC (via PCI IRQ router)</text>
  <text x="600" y="322" text-anchor="middle" fill="#555" font-size="12">raises IRQ n to the CPU</text>

  <line x1="600" y1="332" x2="600" y2="354" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="356" width="260" height="46" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="600" y="375" text-anchor="middle" fill="#222">VMM / NT kernel IRQ dispatch</text>
  <text x="600" y="392" text-anchor="middle" fill="#555" font-size="12">the only interrupt path Win98 knows</text>

  <line x1="600" y1="402" x2="600" y2="424" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="470" y="426" width="260" height="46" rx="5" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="600" y="445" text-anchor="middle" font-weight="bold" fill="#222">usbport.sys ISR → DPC</text>
  <text x="600" y="462" text-anchor="middle" fill="#555" font-size="12">calls the miniport from its ISR and DPC</text>

  <line x1="600" y1="472" x2="600" y2="490" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="600" y="508" text-anchor="middle" font-weight="bold" fill="#d9480f">xhci98.sys drains the Event Ring</text>

  <!-- Footer -->
  <g stroke="#e6e6e6"><line x1="40" y1="530" x2="760" y2="530"/></g>
  <text x="400" y="548" text-anchor="middle" font-size="12" fill="#555">Polling is ruled out too: usbport.sys is interrupt-driven, Win98 timers are too coarse for USB's millisecond timing,</text>
  <text x="400" y="565" text-anchor="middle" font-size="12" fill="#555">and a loop fast enough to keep up would eat the CPU. Controllers that report no interrupt pin are refused.</text>
</svg>
