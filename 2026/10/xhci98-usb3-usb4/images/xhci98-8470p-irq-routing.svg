<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How xhci98.sys finds the xHCI controller's IRQ on an HP EliteBook 8470p</title>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
  </defs>

  <rect width="760" height="476" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How xhci98.sys finds the right IRQ on the HP EliteBook 8470p</text>

  <!-- Layer labels -->
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="18" y="72">HARDWARE</text>
    <text x="18" y="282">DRIVER</text>
    <text x="18" y="400">WINDOWS</text>
  </g>

  <!-- HARDWARE: xHCI controller -->
  <g font-size="11">
    <rect x="130" y="70" width="130" height="70" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
    <text x="195" y="92" text-anchor="middle" font-weight="bold" fill="#4c1d95">xHCI controller</text>
    <text x="195" y="109" text-anchor="middle" fill="#333">PCI device 00:14.0</text>
    <text x="195" y="126" text-anchor="middle" fill="#333">interrupt pin INTA</text>
  </g>

  <!-- HARDWARE: chipset -->
  <rect x="300" y="50" width="440" height="182" rx="8" fill="#f3f4f6" stroke="#9aa0a6"/>
  <text x="312" y="68" font-size="11" font-weight="bold" fill="#444">Intel 7-series chipset</text>

  <!-- Routing registers -->
  <g font-size="11">
    <text x="376" y="133" text-anchor="middle" font-size="10" fill="#666">routing registers (RCBA)</text>
    <rect x="312" y="140" width="128" height="36" rx="5" fill="#eef4ff" stroke="#7a9cc6"/>
    <text x="376" y="163" text-anchor="middle" fill="#222"><tspan font-weight="bold">D20IP:</tspan> pin = INTA</text>
    <rect x="312" y="182" width="128" height="36" rx="5" fill="#eef4ff" stroke="#7a9cc6"/>
    <text x="376" y="205" text-anchor="middle" fill="#222"><tspan font-weight="bold">D20IR:</tspan> INTA to PIRQA</text>
  </g>

  <!-- PIRQ lines and I/O APIC inputs -->
  <text x="592" y="82" text-anchor="middle" font-size="10" fill="#666">internal interrupt lines PIRQA to PIRQH</text>
  <g font-size="11" text-anchor="middle">
    <g fill="#ffffff" stroke="#9aa0a6">
      <rect x="490" y="90" width="34" height="30"/>
      <rect x="524" y="90" width="34" height="30"/>
      <rect x="558" y="90" width="34" height="30"/>
      <rect x="592" y="90" width="34" height="30"/>
      <rect x="626" y="90" width="34" height="30"/>
      <rect x="660" y="90" width="34" height="30"/>
      <rect x="694" y="90" width="34" height="30"/>
      <rect x="490" y="165" width="34" height="30"/>
      <rect x="524" y="165" width="34" height="30"/>
      <rect x="558" y="165" width="34" height="30"/>
      <rect x="592" y="165" width="34" height="30"/>
      <rect x="626" y="165" width="34" height="30"/>
      <rect x="660" y="165" width="34" height="30"/>
      <rect x="694" y="165" width="34" height="30"/>
    </g>
    <g stroke="#9aa0a6" stroke-width="1.5">
      <line x1="507" y1="120" x2="507" y2="165"/>
      <line x1="541" y1="120" x2="541" y2="165"/>
      <line x1="575" y1="120" x2="575" y2="165"/>
      <line x1="609" y1="120" x2="609" y2="165"/>
      <line x1="643" y1="120" x2="643" y2="165"/>
      <line x1="677" y1="120" x2="677" y2="165"/>
      <line x1="711" y1="120" x2="711" y2="165"/>
    </g>
    <g fill="#666">
      <text x="507" y="110">B</text>
      <text x="541" y="110">C</text>
      <text x="575" y="110">D</text>
      <text x="609" y="110">E</text>
      <text x="643" y="110">F</text>
      <text x="677" y="110">G</text>
      <text x="711" y="110">H</text>
      <text x="507" y="185">17</text>
      <text x="541" y="185">18</text>
      <text x="575" y="185">19</text>
      <text x="609" y="185">20</text>
      <text x="643" y="185">21</text>
      <text x="677" y="185">22</text>
      <text x="711" y="185">23</text>
    </g>
    <!-- Highlighted route: PIRQA to IRQ 16 -->
    <rect x="456" y="90" width="34" height="30" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/>
    <rect x="456" y="165" width="34" height="30" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/>
    <text x="473" y="110" font-weight="bold" fill="#b33a00">A</text>
    <text x="473" y="185" font-weight="bold" fill="#b33a00">16</text>
    <line x1="473" y1="122" x2="473" y2="162" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="592" y="212" text-anchor="middle" font-size="10" fill="#666">I/O APIC inputs = IRQ 16 to 23 (fixed wiring)</text>

  <!-- Interrupt signal from the controller -->
  <line x1="262" y1="105" x2="453" y2="105" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="376" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#d9480f">INTA</text>

  <!-- DRIVER -->
  <g font-size="11">
    <rect x="130" y="262" width="610" height="80" rx="8" fill="#fff1e6" stroke="#d9480f" stroke-width="3"/>
    <text x="435" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#b33a00">xhci98.sys</text>
    <text x="435" y="301" text-anchor="middle" fill="#333">1. Reads D20IP and D20IR to learn the pin and its PIRQ line</text>
    <text x="435" y="317" text-anchor="middle" fill="#333">2. IRQ = 16 + position of the PIRQ line = 16 + 0 (PIRQA) = 16</text>
    <text x="435" y="333" text-anchor="middle" fill="#333">3. Offers IRQ 16 to Windows. Falls back to polling if refused or silent</text>
  </g>
  <line x1="376" y1="259" x2="376" y2="221" stroke="#d9480f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>
  <text x="386" y="250" font-size="10" font-weight="bold" fill="#d9480f">reads only, writes nothing</text>

  <!-- WINDOWS -->
  <g font-size="11">
    <rect x="130" y="384" width="250" height="70" rx="6" fill="#fff5f5" stroke="#c92a2a" stroke-dasharray="5 3"/>
    <text x="255" y="408" text-anchor="middle" font-weight="bold" fill="#222">ACPI interrupt routing table</text>
    <text x="255" y="425" text-anchor="middle" fill="#555">written by the BIOS</text>
    <text x="255" y="442" text-anchor="middle" fill="#c92a2a" font-style="italic">no entry for the xHCI controller</text>

    <rect x="480" y="384" width="260" height="70" rx="6" fill="#e3f1e4" stroke="#4f8a57" stroke-width="1.5"/>
    <text x="610" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4a22">Windows XP</text>
    <text x="610" y="425" text-anchor="middle" fill="#c92a2a">BIOS alone: no IRQ, Code 12</text>
    <text x="610" y="442" text-anchor="middle" fill="#333">with the driver's offer: IRQ 16, starts</text>
  </g>
  <line x1="382" y1="419" x2="477" y2="419" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="430" y="411" text-anchor="middle" font-size="10" font-weight="bold" fill="#c92a2a">no IRQ</text>
  <line x1="610" y1="345" x2="610" y2="381" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="620" y="367" font-size="10" font-weight="bold" fill="#d9480f">offers IRQ 16</text>
</svg>
