<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" width="760" height="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How xhci98.sys repairs the xHCI controller's interrupt route on a Dell Latitude E7250</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
  </defs>

  <rect width="760" height="572" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How xhci98.sys repairs the interrupt route on the Dell Latitude E7250</text>

  <!-- Layer labels -->
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="18" y="72">HARDWARE</text>
    <text x="18" y="380">DRIVER</text>
    <text x="18" y="500">WINDOWS</text>
  </g>

  <!-- HARDWARE: controllers -->
  <g font-size="11">
    <rect x="130" y="50" width="160" height="60" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
    <text x="210" y="74" text-anchor="middle" font-weight="bold" fill="#4c1d95">xHCI controller</text>
    <text x="210" y="93" text-anchor="middle" fill="#333">interrupt pin INTA</text>

    <rect x="560" y="50" width="180" height="60" rx="6" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="650" y="74" text-anchor="middle" font-weight="bold" fill="#444">EHCI controller</text>
    <text x="650" y="93" text-anchor="middle" fill="#666">interrupt pin INTA</text>
  </g>

  <!-- HARDWARE: chipset -->
  <rect x="130" y="128" width="610" height="202" rx="8" fill="#f3f4f6" stroke="#9aa0a6"/>
  <text x="728" y="147" text-anchor="end" font-size="11" font-weight="bold" fill="#444">Intel chipset</text>

  <!-- Routing registers -->
  <g font-size="11">
    <text x="221" y="200" text-anchor="middle" font-size="10" fill="#666">routing registers (RCBA)</text>
    <rect x="142" y="206" width="158" height="36" rx="5" fill="#eef4ff" stroke="#7a9cc6"/>
    <text x="221" y="229" text-anchor="middle" fill="#222"><tspan font-weight="bold">D29IR</tspan> (EHCI): PIRQF</text>
    <rect x="142" y="250" width="158" height="36" rx="5" fill="#fff1e6" stroke="#d9480f" stroke-width="2"/>
    <text x="221" y="273" text-anchor="middle" fill="#222"><tspan font-weight="bold">D20IR</tspan> (xHCI): PIRQA to F</text>
  </g>

  <!-- PIRQ lines and I/O APIC inputs -->
  <g font-size="10" text-anchor="middle">
    <g fill="#ffffff" stroke="#9aa0a6">
      <rect x="370" y="190" width="50" height="30"/>
      <rect x="420" y="190" width="50" height="30"/>
      <rect x="470" y="190" width="50" height="30"/>
      <rect x="520" y="190" width="50" height="30"/>
      <rect x="620" y="190" width="50" height="30"/>
      <rect x="670" y="190" width="50" height="30"/>
      <rect x="370" y="265" width="50" height="30"/>
      <rect x="420" y="265" width="50" height="30"/>
      <rect x="470" y="265" width="50" height="30"/>
      <rect x="520" y="265" width="50" height="30"/>
      <rect x="620" y="265" width="50" height="30"/>
      <rect x="670" y="265" width="50" height="30"/>
    </g>
    <g stroke="#9aa0a6" stroke-width="1.5">
      <line x1="395" y1="220" x2="395" y2="265"/>
      <line x1="445" y1="220" x2="445" y2="265"/>
      <line x1="495" y1="220" x2="495" y2="265"/>
      <line x1="545" y1="220" x2="545" y2="265"/>
      <line x1="645" y1="220" x2="645" y2="265"/>
      <line x1="695" y1="220" x2="695" y2="265"/>
    </g>
    <g fill="#666">
      <text x="395" y="209">PIRQB</text>
      <text x="445" y="209">PIRQC</text>
      <text x="495" y="209">PIRQD</text>
      <text x="545" y="209">PIRQE</text>
      <text x="645" y="209">PIRQG</text>
      <text x="695" y="209">PIRQH</text>
      <text x="395" y="284">IRQ 17</text>
      <text x="445" y="284">IRQ 18</text>
      <text x="495" y="284">IRQ 19</text>
      <text x="545" y="284">IRQ 20</text>
      <text x="645" y="284">IRQ 22</text>
      <text x="695" y="284">IRQ 23</text>
    </g>

    <!-- Wrong route: PIRQA to IRQ 16 -->
    <rect x="320" y="190" width="50" height="30" fill="#fff5f5" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="320" y="265" width="50" height="30" fill="#fff5f5" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="345" y="209" font-weight="bold" fill="#c92a2a">PIRQA</text>
    <text x="345" y="284" font-weight="bold" fill="#c92a2a">IRQ 16</text>
    <line x1="345" y1="222" x2="345" y2="262" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>

    <!-- Right route: PIRQF to IRQ 21 -->
    <rect x="570" y="190" width="50" height="30" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/>
    <rect x="570" y="265" width="50" height="30" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/>
    <text x="595" y="209" font-weight="bold" fill="#b33a00">PIRQF</text>
    <text x="595" y="284" font-weight="bold" fill="#b33a00">IRQ 21</text>
    <line x1="595" y1="222" x2="595" y2="262" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="520" y="314" text-anchor="middle" font-size="10" fill="#666">PIRQA to PIRQH are wired to I/O APIC inputs IRQ 16 to 23 (fixed wiring)</text>

  <!-- xHCI route set by the BIOS (wrong) -->
  <path d="M200,112 L200,168 L345,168 L345,187" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <text x="272" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#c92a2a">set by the BIOS</text>

  <!-- xHCI route after the driver's rewrite -->
  <path d="M240,112 L240,152 L583,152 L583,187" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="410" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#d9480f">after the driver's rewrite</text>

  <!-- EHCI route -->
  <line x1="607" y1="112" x2="607" y2="187" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DRIVER -->
  <g font-size="11">
    <rect x="130" y="360" width="610" height="80" rx="8" fill="#fff1e6" stroke="#d9480f" stroke-width="3"/>
    <text x="435" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#b33a00">xhci98.sys</text>
    <text x="435" y="399" text-anchor="middle" fill="#333">1. Windows assigns it IRQ 21, as the ACPI table says</text>
    <text x="435" y="415" text-anchor="middle" fill="#333">2. Reads D20IR: INTA goes to PIRQA, which is IRQ 16. A mismatch</text>
    <text x="435" y="431" text-anchor="middle" fill="#333">3. Rewrites D20IR so INTA goes to PIRQF, which is IRQ 21</text>
  </g>
  <line x1="221" y1="357" x2="221" y2="289" stroke="#d9480f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>
  <text x="231" y="348" font-size="10" font-weight="bold" fill="#d9480f">rewrites D20IR</text>

  <!-- WINDOWS -->
  <g font-size="11">
    <rect x="130" y="482" width="250" height="70" rx="6" fill="#fff5f5" stroke="#c92a2a" stroke-dasharray="5 3"/>
    <text x="255" y="504" text-anchor="middle" font-weight="bold" fill="#222">ACPI interrupt routing table</text>
    <text x="255" y="521" text-anchor="middle" fill="#555">EHCI controller: IRQ 21</text>
    <text x="255" y="538" text-anchor="middle" fill="#c92a2a" font-style="italic">xHCI controller: IRQ 21 (wrong)</text>

    <rect x="480" y="482" width="260" height="70" rx="6" fill="#e3f1e4" stroke="#4f8a57" stroke-width="1.5"/>
    <text x="610" y="504" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4a22">Windows XP</text>
    <text x="610" y="521" text-anchor="middle" fill="#c92a2a">BIOS alone: only the EHCI interrupts on IRQ 21</text>
    <text x="610" y="538" text-anchor="middle" fill="#333">after the rewrite: the xHCI arrives there too</text>
  </g>
  <line x1="382" y1="517" x2="477" y2="517" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="430" y="509" text-anchor="middle" font-size="10" font-weight="bold" fill="#c92a2a">IRQ 21</text>
  <line x1="610" y1="479" x2="610" y2="443" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="465" font-size="10" font-weight="bold" fill="#555">assigns IRQ 21</text>
</svg>
